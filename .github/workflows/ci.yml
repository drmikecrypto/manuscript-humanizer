name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_PYTHON_VERSION_WARNING: "1"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: python -m pip install ruff==0.9.6

      - name: Ruff (pyflakes)
        run: ruff check src tests --select F

  test:
    name: Test · Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and test dependencies
        run: python -m pip install -e ".[full,dev]"

      - name: Cache ONNX detector model
        id: model-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/manuscript-humanizer/models
          key: onnx-aigc-detector-en-${{ runner.os }}-v1

      - name: Download ONNX detector model
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: python -c "from humanizer.analyzers.model_loader import download_model; download_model()"

      - name: Run tests
        run: python -m pytest tests/ -q --tb=short --durations=10

      - name: Smoke test CLI
        run: |
          mh score examples/demo_manuscript.md
          mh --version

  build:
    name: Build & install
    runs-on: ubuntu-latest
    needs: [lint, test]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install from source
        run: python -m pip install -e ".[full,dev]"

      - name: Cache ONNX detector model
        id: model-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/manuscript-humanizer/models
          key: onnx-aigc-detector-en-${{ runner.os }}-v1

      - name: Download ONNX detector model
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: python -c "from humanizer.analyzers.model_loader import download_model; download_model()"

      - name: Verify CLI entry points
        run: |
          mh --version
          mh score examples/demo_manuscript.md
          python -c "import humanizer; print('humanizer', humanizer.__version__)"
