[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "manuscript-humanizer"
version = "0.1.0"
description = "Offline academic AI humanizer — GPTZero/Turnitin-aware manuscript rewriter with ONNX segment detection"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = [
    "ai-humanizer",
    "academic-writing",
    "gptzero",
    "turnitin",
    "manuscript",
    "stylometrics",
    "onnx",
    "nlp",
    "thesis",
    "research-paper",
    "ai-detector",
    "burstiness",
    "offline",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "httpx>=0.27.0",
    "rich>=13.7.0",
    "tomli>=2.0.1; python_version < '3.11'",
    "tomli-w>=1.0.0",
]

[project.optional-dependencies]
ml = ["onnxruntime>=1.17", "tokenizers>=0.15", "numpy>=1.24"]
lexicon = ["wordfreq>=3.0"]
full = ["manuscript-humanizer[ml,lexicon]"]
llm = ["openai>=1.30.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
manuscript-humanizer = "humanizer.cli:main"
mh = "humanizer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
humanizer = ["py.typed"]

[tool.setuptools.data-files]
"share/manuscript-humanizer" = ["data/lexicons/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
