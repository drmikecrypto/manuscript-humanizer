# Copy to config.toml and fill in your values.

[llm]
provider = "openai"
api_key = ""
base_url = ""
model = "gpt-4o-mini"
temperature = 0.85
max_tokens = 8192

[pipeline]
engine = "segment"
one_shot = false
target_ai_score = 5.0
max_passes = 25
sentences_per_pass = 0
rewrite_all_sentences = false
early_stop_delta = 1.0
max_iterations = 10
min_meaning_similarity = 0.72
preserve_citations = true
preserve_numbers = true
aggression = "conservative"
allow_tone_down = false
chunk_size = 3500
chunk_overlap = 200

[detector]
engine = "onnx"
model = "aigc-detector-en"
span_threshold = 45.0
window_words = 150
window_overlap = 0.5
calibration_offset = 8.0
gptzero_api_key = ""
originality_api_key = ""
use_external_detector = false
external_weight = 0.4

[lexicon]
domains = ["medicine", "veterinary", "engineering"]
protect_domain_terms = true

[output]
show_diff = false
save_intermediate = true
intermediate_dir = ".humanizer_runs"
