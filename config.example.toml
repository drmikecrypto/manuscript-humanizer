# Copy to config.toml and fill in your values.

[llm]
provider = "openai"          # openai | deepseek | custom
api_key = ""                 # or set OPENAI_API_KEY / DEEPSEEK_API_KEY env var
base_url = ""                # empty = provider default; e.g. https://api.deepseek.com
model = "gpt-4o-mini"        # deepseek-chat, gpt-4o, claude via proxy, etc.
temperature = 0.85
max_tokens = 8192

[pipeline]
target_ai_score = 15.0       # stop when composite score drops below this (0-100)
max_iterations = 5
min_meaning_similarity = 0.82
preserve_citations = true
preserve_numbers = true
chunk_size = 3500           # chars per chunk for long manuscripts
chunk_overlap = 200

[detector]
# Optional external detector APIs (leave empty to use built-in statistical proxy)
gptzero_api_key = ""
originality_api_key = ""
use_external_detector = false
external_weight = 0.4        # blend with built-in score when external is enabled

[output]
show_diff = false
save_intermediate = true
intermediate_dir = ".humanizer_runs"
